name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'jiangge/pi-router' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Verify release version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          else
            test "${GITHUB_REF_NAME}" = master
            test "$(git ls-remote --tags origin "refs/tags/v${version}" | wc -l)" -eq 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Install Pi for integration tests
        run: npm install --global @earendil-works/pi-coding-agent@0.87.1
      - name: Run tests with installed Pi
        run: PI_ROUTER_TEST_PI_ROOT="$(npm root --global)/@earendil-works/pi-coding-agent" npm test
      - run: npm publish --provenance --access public
