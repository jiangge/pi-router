name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Pi host (peer packages for typecheck:pi and Pi-host tests)
        run: npm install --global @earendil-works/pi-coding-agent@1.6.0
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck against installed Pi
        run: npm run typecheck:pi
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
