name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node 24 / Pi ${{ matrix.pi-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: ['1.3.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Pi host
        run: npm install --global "@earendil-works/pi-coding-agent@${{ matrix.pi-version }}"
      - name: Check host compatibility
        run: |
          export PI_ROUTER_TEST_PI_ROOT="$(npm root --global)/@earendil-works/pi-coding-agent"
          npm run typecheck:pi
      - name: Run tests against installed Pi
        run: |
          export PI_ROUTER_TEST_PI_ROOT="$(npm root --global)/@earendil-works/pi-coding-agent"
          npm test
